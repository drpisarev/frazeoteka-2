<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frazeoteka 2</title>
<meta name="description" content="Srpski frazeološki rečnik za ruskojezične korisnike">
<style>
:root{
  --bg:#f7f9fc; --panel:#fff; --text:#13224a; --muted:#6b7692; --line:#e4e9f2;
  --blue:#1959d6; --blue2:#edf4ff; --purple:#7a4bd9; --red:#d94841; --gold:#d59a00;
  --shadow:0 10px 30px rgba(17,34,74,.06); --radius:18px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.shell{max-width:1480px;margin:auto;padding:0 22px 28px}
.site-header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.header-inner{max-width:1480px;margin:auto;padding:14px 22px;display:flex;align-items:center;gap:34px}
.brand{display:flex;align-items:center;gap:13px;min-width:340px}
.logo{width:62px;height:62px;border-radius:14px;overflow:hidden;box-shadow:0 3px 10px rgba(20,36,80,.1);flex:0 0 auto}
.logo svg{display:none}
.serbian-mark{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:
    linear-gradient(to bottom,
      #d9363e 0 33.333%,
      #163c7a 33.333% 66.666%,
      #ffffff 66.666% 100%);
}
.serbian-mark img{
  display:block;
  width:66%;
  height:88%;
  object-fit:contain;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.16));
}
.brand-title{font-family:Georgia,"Times New Roman",serif;font-size:34px;font-weight:700;line-height:1;color:#10245b}
.brand-sub{font-size:14px;letter-spacing:.06em;color:#415681;margin-top:5px}
.nav{display:flex;gap:28px;align-items:center;flex:1}
.nav a{padding:8px 0;color:#253865;font-family:Georgia,"Times New Roman",serif;font-size:17px}
.nav a.active{color:var(--blue);border-bottom:3px solid var(--blue)}
.header-tools{display:flex;gap:18px;color:#253865;font-size:14px}
.hero-tools{display:grid;grid-template-columns:1fr auto;gap:14px;margin:18px 0 12px}
.searchbox{position:relative}
.searchbox input{width:100%;height:58px;border:1px solid #bfd2f3;border-radius:15px;background:#fff;padding:0 54px 0 54px;font-size:19px;outline:none;box-shadow:0 0 0 1px rgba(25,89,214,.02)}
.searchbox input:focus{border-color:#7ea6ef;box-shadow:0 0 0 4px rgba(25,89,214,.08)}
.search-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:26px;color:#193567}
.advanced{height:58px;padding:0 18px;border:1px solid var(--line);border-radius:15px;background:#fff;color:#254376;font-weight:700}
.alphabet{display:flex;gap:4px;align-items:center;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:14px}
.alphabet button{border:0;background:transparent;padding:6px 9px;border-radius:8px;color:#1d315f;font-weight:650;white-space:nowrap}
.alphabet button.active,.alphabet button:hover{background:var(--blue);color:white}
.layout{display:grid;grid-template-columns:360px 1fr;gap:16px}
.sidebar,.content{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.sidebar{overflow:hidden}
.filters{padding:16px 18px;border-bottom:1px solid var(--line)}
.filters-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.filters-head h3,.list-head h3{margin:0;font-size:13px;letter-spacing:.06em}
.clear{border:0;background:none;color:var(--blue)}
.filter{margin-bottom:8px}
.filter select{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 10px;color:#253865}
.found{color:#7280a0;margin-top:10px}
.list-head{display:flex;justify-content:space-between;padding:14px 18px 8px}
.entry-list{max-height:580px;overflow:auto}
.entry-item{padding:10px 18px;border-top:1px solid #f0f2f7;cursor:pointer;color:#203661}
.entry-item:hover{background:#f7faff}
.entry-item.active{background:#edf4ff;color:#0e5bd7;border-left:4px solid var(--blue);padding-left:14px}
.entry-item .word{font-weight:720}
.entry-item .shortdef{font-size:12px;color:#7b86a0;margin-top:2px}
.content{padding:24px 34px}
.entry-header{display:flex;align-items:flex-start;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.entry-header h1{font-family:Georgia,"Times New Roman",serif;font-size:56px;line-height:1;margin:0;color:#10245b}
.tags{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px}
.tag{font-size:13px;font-weight:800;padding:5px 10px;border-radius:8px;border:1px solid}
.tag.type{color:#1960d9;border-color:#8ab2ef;background:#f5f9ff}
.tag.register{color:#7a4bd9;border-color:#c9aef4;background:#fbf8ff}
.tag.eval{color:#d94841;border-color:#f2aaa6;background:#fff8f7}
.bookmark{margin-left:auto;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:#fff;color:#244171;font-size:20px}
.section-row{display:grid;grid-template-columns:210px 1fr;gap:28px;padding:24px 0;border-bottom:1px solid var(--line)}
.section-label{display:flex;align-items:flex-start;gap:12px;color:#0f5bd7;font-weight:850;letter-spacing:.02em}
.icon-circle{width:36px;height:36px;border-radius:50%;background:#1260df;color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:16px}
.section-content{font-family:Georgia,"Times New Roman",serif;font-size:20px;color:#1f2937}
.section-content.small{font-size:18px}
.example-serbian{font-style:italic;font-size:21px}
.example-russian{margin-top:8px;color:#657391;font-size:17px}
.source{font-size:16px}
.note-box{background:#fffdf6;border:1px solid #f0e0aa;border-radius:12px;padding:14px 16px}
.empty{padding:70px 20px;text-align:center;color:var(--muted)}
.admin-fab{position:fixed;right:22px;bottom:22px;width:52px;height:52px;border-radius:50%;border:0;background:#10245b;color:#fff;box-shadow:0 10px 25px rgba(16,36,91,.28);font-size:21px;z-index:40}
dialog{border:0;border-radius:18px;padding:0;width:min(760px,calc(100vw - 28px));box-shadow:0 24px 70px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(7,17,40,.38)}
.dialog-inner{padding:20px}
.dialog-head{display:flex;justify-content:space-between;gap:14px;align-items:center}
.dialog-head h2{margin:0}
.btn{border:1px solid var(--line);background:#fff;color:#1e345f;padding:9px 12px;border-radius:10px;font-weight:750}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--red);border-color:#efc1be;background:#fff8f7}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.admin-tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:14px 0}
.admin-tab{border:0;background:none;padding:9px 10px;font-weight:800;color:var(--muted);border-bottom:2px solid transparent}
.admin-tab.active{color:var(--blue);border-color:var(--blue)}
.admin-view{display:none}.admin-view.active{display:block}
.field{margin-bottom:11px}
.field label{display:block;font-size:13px;font-weight:800;margin-bottom:5px;color:#405274}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;outline:none}
.field textarea{min-height:90px;resize:vertical}
.field textarea.json{min-height:300px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
.status{font-size:13px;font-weight:800;margin-top:8px}
.status.ok{color:#18794e}.status.err{color:#b42318}
@media(max-width:1000px){
  .header-inner{flex-wrap:wrap}.brand{min-width:0}.nav{order:3;width:100%;overflow:auto}
  .layout{grid-template-columns:1fr}.sidebar{order:2}.content{order:1}
  .entry-list{max-height:300px}
}
@media(max-width:680px){
  .shell{padding:0 10px 20px}.header-inner{padding:12px 10px}
  .brand-title{font-size:28px}.logo{width:52px;height:52px}.header-tools{display:none}
  .hero-tools{grid-template-columns:1fr}.advanced{display:none}
  .content{padding:18px}.entry-header h1{font-size:42px}.section-row{grid-template-columns:1fr;gap:10px}
  .section-content{font-size:18px}.settings-grid{grid-template-columns:1fr}.full{grid-column:auto}
}
</style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <div class="logo serbian-mark" aria-label="Srpski orao">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/9/97/Serbian_Eagle.svg"
          alt="Srpski dvoglavi orao"
          title="Serbian Eagle — MazzyBor, CC BY-SA 4.0, Wikimedia Commons">
      </div>
      <div>
        <div class="brand-title">Frazeoteka 2</div>
        <div class="brand-sub">srpski frazeološki rečnik</div>
      </div>
    </div>
    <nav class="nav">
      <a href="#" class="active">Rečnik</a>
      <a href="#about">O projektu</a>
    </nav>
    <div class="header-tools"><span>Sačuvano</span><span>O rečniku</span></div>
  </div>
</header>

<div class="shell">
  <div class="hero-tools">
    <div class="searchbox">
      <span class="search-icon">⌕</span>
      <input id="searchInput" placeholder="Pretraži frazu, reč ili izraz...">
    </div>
    <button class="advanced" id="resetBtn">Očisti pretragu</button>
  </div>

  <div class="alphabet" id="alphabet"></div>

  <div class="layout">
    <aside class="sidebar">
      <div class="filters">
        <div class="filters-head"><h3>FILTRI</h3><button class="clear" id="clearFilters">Očisti sve</button></div>
        <div class="filter"><select id="typeFilter"><option value="">Sve vrste reči</option></select></div>
        <div class="filter"><select id="registerFilter"><option value="">Svi stilovi</option></select></div>
        <div class="found" id="foundLabel"></div>
      </div>
      <div class="list-head"><h3>SPISAK ODREDNICA</h3><span>A–Ž</span></div>
      <div class="entry-list" id="entryList"></div>
    </aside>

    <main class="content" id="content">
      <div class="empty">Učitavanje rečnika…</div>
    </main>
  </div>
</div>

<button class="admin-fab" id="adminBtn" title="Administracija">⚙</button>

<dialog id="adminDialog">
  <div class="dialog-inner">
    <div class="dialog-head">
      <h2>Administracija</h2>
      <button class="btn" onclick="adminDialog.close()">Zatvori</button>
    </div>

    <div class="admin-tabs">
      <button class="admin-tab active" data-view="addView">Dodaj JSON</button>
      <button class="admin-tab" data-view="editView">Uredi</button>
      <button class="admin-tab" data-view="githubView">GitHub</button>
    </div>

    <section class="admin-view active" id="addView">
      <div class="field">
        <label>JSON iz ChatGPT-a</label>
        <textarea id="jsonInput" class="json" placeholder='{"entries":[...]}'></textarea>
      </div>
      <div class="toolbar">
        <button class="btn primary" id="addJsonBtn">Dodaj u rečnik</button>
      </div>
      <div id="addStatus" class="status"></div>
    </section>

    <section class="admin-view" id="editView">
      <div class="field"><label>headword_latin</label><input id="f_head"></div>
      <div class="field"><label>type</label><input id="f_type"></div>
      <div class="field"><label>definition_ru</label><textarea id="f_def"></textarea></div>
      <div class="field"><label>synonyms_sr — srpski sinonimi (через •)</label><input id="f_analogs"></div>
      <div class="field"><label>literal_ru</label><input id="f_literal"></div>
      <div class="field"><label>register</label><textarea id="f_reg"></textarea></div>
      <div class="field"><label>Пример — serbian_latin</label><textarea id="f_exsr"></textarea></div>
      <div class="field"><label>Пример — russian</label><textarea id="f_exru"></textarea></div>
      <div class="field"><label>note</label><textarea id="f_note"></textarea></div>
      <div class="field"><label>keyword</label><input id="f_keyword"></div>
      <div class="toolbar">
        <button class="btn primary" id="saveEditBtn">Sačuvaj lokalno</button>
        <button class="btn danger" id="deleteBtn">Obriši</button>
      </div>
    </section>

    <section class="admin-view" id="githubView">
      <div class="settings-grid">
        <div class="field"><label>Owner</label><input id="ghOwner" value="drpisarev"></div>
        <div class="field"><label>Repository</label><input id="ghRepo" value="frazeoteka-2"></div>
        <div class="field"><label>Branch</label><input id="ghBranch" value="main"></div>
        <div class="field"><label>Database file</label><input id="ghPath" value="data/frazeoteka.json"></div>
        <div class="field full"><label>Fine-grained PAT</label><input id="ghToken" type="password" placeholder="github_pat_..."></div>
        <div class="field full"><label><input id="rememberToken" type="checkbox" style="width:auto"> Zapamti token u ovom pregledaču</label></div>
      </div>
      <div class="toolbar">
        <button class="btn" id="saveSettings">Sačuvaj podešavanja</button>
        <button class="btn" id="pullBtn">Učitaj sa GitHub-a</button>
        <button class="btn primary" id="pushBtn">Sačuvaj na GitHub</button>
      </div>
      <div id="ghStatus" class="status"></div>
    </section>
  </div>
</dialog>

<script>
const DBKEY="frazeoteka2_db", CFGKEY="frazeoteka2_cfg", SHAKEY="frazeoteka2_sha";
let entries=[], selected=null, alpha="SVE";

const $=id=>document.getElementById(id);
const norm=s=>String(s||"").trim().toLocaleLowerCase("sr-Latn");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));

function saveLocal(){localStorage.setItem(DBKEY,JSON.stringify(entries))}
function loadLocal(){try{return JSON.parse(localStorage.getItem(DBKEY)||"[]")}catch{return[]}}
function saveCfg(c){localStorage.setItem(CFGKEY,JSON.stringify(c))}
function loadCfg(){try{return JSON.parse(localStorage.getItem(CFGKEY)||"{}")}catch{return{}}}
function ghHeaders(token){return {"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"}}
function b64decode(s){return decodeURIComponent(escape(atob(s.replace(/\n/g,""))))}
function b64encode(s){return btoa(unescape(encodeURIComponent(s)))}

async function init(){
  const local=loadLocal();

  if(local.length){
    // Если в браузере уже есть база — никогда не затираем её
    // старой копией с GitHub Pages.
    entries=local;
  }else{
    // Только при первом запуске загружаем базу сайта.
    try{
      const r=await fetch("data/frazeoteka.json",{cache:"no-store"});
      if(r.ok){
        const d=await r.json();
        if(Array.isArray(d.entries)){
          entries=d.entries;
          saveLocal();
        }
      }
    }catch{}
  }

  entries.sort((a,b)=>
    String(a.headword_latin||"")
      .localeCompare(String(b.headword_latin||""),"sr-Latn")
  );

  selected=entries[0]?.headword_latin||null;
  buildAlphabet();
  buildFilters();
  renderList();
  renderEntry();
}
function buildAlphabet(){
  const letters=["SVE","A","B","C","Č","Ć","D","Dž","Đ","E","F","G","H","I","J","K","L","Lj","M","N","Nj","O","P","R","S","Š","T","U","V","Z","Ž"];
  $("alphabet").innerHTML=letters.map(x=>`<button data-a="${x}" class="${x===alpha?'active':''}">${x}</button>`).join("");
  $("alphabet").querySelectorAll("button").forEach(b=>b.onclick=()=>{alpha=b.dataset.a;buildAlphabet();renderList()});
}
function buildFilters(){
  const types=[...new Set(entries.map(e=>e.type).filter(Boolean))].sort();
  $("typeFilter").innerHTML='<option value="">Sve vrste reči</option>'+types.map(x=>`<option>${esc(x)}</option>`).join("");
  const regs=[...new Set(entries.map(e=>(e.register||"").split(/[;,]/)[0].trim()).filter(Boolean))].sort();
  $("registerFilter").innerHTML='<option value="">Svi stilovi</option>'+regs.map(x=>`<option>${esc(x)}</option>`).join("");
}
function filtered(){
  const q=norm($("searchInput").value), t=$("typeFilter").value, r=$("registerFilter").value;
  return entries.filter(e=>{
    const blob=[e.headword_latin,e.definition_ru,e.literal_ru,e.register,e.note,e.keyword,...(e.synonyms_sr||[]),...(e.analogs_ru||[]),...(e.examples||[]).flatMap(x=>[x.serbian_latin,x.russian])].join(" ");
    const alphaOk=alpha==="SVE" || norm(e.headword_latin).startsWith(norm(alpha));
    return (!q||norm(blob).includes(q)) && (!t||e.type===t) && (!r||(e.register||"").startsWith(r)) && alphaOk;
  });
}
function renderList(){
  const f=filtered();
  $("foundLabel").textContent=`Pronađeno: ${f.length} ${f.length===1?'odrednica':'odrednica'}`;
  $("entryList").innerHTML=f.length?f.map(e=>`<div class="entry-item ${e.headword_latin===selected?'active':''}" data-k="${esc(e.headword_latin)}"><div class="word">${esc(e.headword_latin)}</div><div class="shortdef">${esc(e.definition_ru||"")}</div></div>`).join(""):'<div class="empty">Nema rezultata.</div>';
  $("entryList").querySelectorAll(".entry-item").forEach(x=>x.onclick=()=>{selected=x.dataset.k;renderList();renderEntry()})
}
function regTags(reg){
  if(!reg)return "";
  return reg.split(/[;,]/).slice(0,2).map((x,i)=>`<span class="tag ${i?'eval':'register'}">${esc(x.trim())}</span>`).join("");
}
function renderEntry(){
  const e=entries.find(x=>x.headword_latin===selected);
  if(!e){$("content").innerHTML='<div class="empty">Rečnik je prazan.</div>';return}
  const ex=e.examples?.[0];
  $("content").innerHTML=`
    <div class="entry-header">
      <h1>${esc(e.headword_latin)}</h1>
      <div class="tags"><span class="tag type">${esc(e.type||"izraz")}</span>${regTags(e.register)}</div>
      <button class="bookmark">♡</button>
    </div>
    <div class="section-row">
      <div class="section-label"><span class="icon-circle">▣</span><span>ZNAČENJE</span></div>
      <div class="section-content">${esc(e.definition_ru||"")}</div>
    </div>
    ${((e.synonyms_sr||e.analogs_ru||[]).length)?`<div class="section-row"><div class="section-label"><span class="icon-circle">≈</span><span>SRPSKI<br>SINONIMI</span></div><div class="section-content small">${(e.synonyms_sr||e.analogs_ru||[]).map(esc).join(" • ")}</div></div>`:""}
    ${e.literal_ru?`<div class="section-row"><div class="section-label"><span class="icon-circle">↔</span><span>BUKVALNO</span></div><div class="section-content small">${esc(e.literal_ru)}</div></div>`:""}
    ${e.note?`<div class="section-row"><div class="section-label"><span class="icon-circle">i</span><span>NAPOMENA<br>O UPOTREBI</span></div><div class="section-content small"><div class="note-box">${esc(e.note)}</div></div></div>`:""}
    ${ex?`<div class="section-row"><div class="section-label"><span class="icon-circle">“</span><span>PRIMER</span></div><div class="section-content"><div class="example-serbian">${esc(ex.serbian_latin||"")}</div><div class="example-russian">— ${esc(ex.russian||"")}</div></div></div>`:""}
    ${e.source?`<div class="section-row"><div class="section-label"><span class="icon-circle">▤</span><span>IZVOR</span></div><div class="section-content source">${esc(e.source)}</div></div>`:""}
  `;
}
function parseIncoming(text){
  const d=JSON.parse(text);let arr;
  if(Array.isArray(d))arr=d; else if(Array.isArray(d.entries))arr=d.entries; else if(d.headword_latin)arr=[d]; else throw new Error("Ne mogu da pronađem entries.");
  return arr;
}
function openEdit(){
  const e=entries.find(x=>x.headword_latin===selected); if(!e)return;
  $("f_head").value=e.headword_latin||"";$("f_type").value=e.type||"";$("f_def").value=e.definition_ru||"";
  $("f_analogs").value=(e.synonyms_sr||e.analogs_ru||[]).join(" • ");$("f_literal").value=e.literal_ru||"";$("f_reg").value=e.register||"";
  $("f_exsr").value=e.examples?.[0]?.serbian_latin||"";$("f_exru").value=e.examples?.[0]?.russian||"";
  $("f_note").value=e.note||"";$("f_keyword").value=e.keyword||"";
}
function setAdminView(id){
  document.querySelectorAll(".admin-view").forEach(v=>v.classList.toggle("active",v.id===id));
  document.querySelectorAll(".admin-tab").forEach(t=>t.classList.toggle("active",t.dataset.view===id));
}
document.querySelectorAll(".admin-tab").forEach(t=>t.onclick=()=>{setAdminView(t.dataset.view);if(t.dataset.view==="editView")openEdit()});

$("adminBtn").onclick=()=>{const c=loadCfg();$("ghOwner").value=c.owner||"drpisarev";$("ghRepo").value=c.repo||"frazeoteka-2";$("ghBranch").value=c.branch||"main";$("ghPath").value=c.path||"data/frazeoteka.json";$("ghToken").value=c.token||sessionStorage.getItem("frazeoteka2_token")||"";$("rememberToken").checked=!!c.token;adminDialog.showModal()};
$("addJsonBtn").onclick=()=>{
  try{
    const arr=parseIncoming($("jsonInput").value);let a=0,u=0;
    arr.forEach(e=>{const i=entries.findIndex(x=>norm(x.headword_latin)===norm(e.headword_latin));if(i>=0){entries[i]=e;u++}else{entries.push(e);a++}selected=e.headword_latin});
    entries.sort((a,b)=>String(a.headword_latin||"").localeCompare(String(b.headword_latin||""),"sr-Latn"));saveLocal();buildFilters();renderList();renderEntry();
    $("addStatus").className="status ok";$("addStatus").textContent=`Dodato: ${a}, ažurirano: ${u}.`;
  }catch(e){$("addStatus").className="status err";$("addStatus").textContent=e.message}
};
$("saveEditBtn").onclick=()=>{
  const old=entries.find(x=>x.headword_latin===selected);if(!old)return;
  const e={...old,headword_latin:$("f_head").value.trim(),type:$("f_type").value.trim(),definition_ru:$("f_def").value.trim(),synonyms_sr:$("f_analogs").value.split("•").map(x=>x.trim()).filter(Boolean),literal_ru:$("f_literal").value.trim(),register:$("f_reg").value.trim(),examples:[{serbian_latin:$("f_exsr").value.trim(),russian:$("f_exru").value.trim()}].filter(x=>x.serbian_latin||x.russian),note:$("f_note").value.trim(),keyword:$("f_keyword").value.trim()};
  entries[entries.indexOf(old)]=e;selected=e.headword_latin;saveLocal();buildFilters();renderList();renderEntry()
};
$("deleteBtn").onclick=()=>{const e=entries.find(x=>x.headword_latin===selected);if(e&&confirm(`Obrisati „${e.headword_latin}“?`)){entries=entries.filter(x=>x!==e);selected=entries[0]?.headword_latin||null;saveLocal();buildFilters();renderList();renderEntry()}};
$("saveSettings").onclick=()=>{
  const token=$("ghToken").value.trim(), c={owner:$("ghOwner").value.trim(),repo:$("ghRepo").value.trim(),branch:$("ghBranch").value.trim()||"main",path:$("ghPath").value.trim()||"data/frazeoteka.json"};
  if($("rememberToken").checked)c.token=token; else sessionStorage.setItem("frazeoteka2_token",token);
  saveCfg(c);$("ghStatus").className="status ok";$("ghStatus").textContent="Podešavanja sačuvana.";
};
function getAuth(){const c=loadCfg(),token=c.token||sessionStorage.getItem("frazeoteka2_token")||"";if(!c.owner||!c.repo||!token)throw new Error("Prvo sačuvajte GitHub podešavanja.");return {...c,token}}
$("pullBtn").onclick=async()=>{
  try{
    const c=getAuth();$("ghStatus").textContent="Učitavanje...";
    const r=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${c.path}?ref=${encodeURIComponent(c.branch)}`,{headers:ghHeaders(c.token)});
    if(!r.ok)throw new Error(`GitHub ${r.status}`);
    const d=await r.json(),obj=JSON.parse(b64decode(d.content));entries=Array.isArray(obj.entries)?obj.entries:[];entries.sort((a,b)=>String(a.headword_latin||"").localeCompare(String(b.headword_latin||""),"sr-Latn"));selected=entries[0]?.headword_latin||null;localStorage.setItem(SHAKEY,d.sha);saveLocal();buildFilters();renderList();renderEntry();$("ghStatus").className="status ok";$("ghStatus").textContent="Baza učitana sa GitHub-a.";
  }catch(e){$("ghStatus").className="status err";$("ghStatus").textContent=e.message}
};
$("pushBtn").onclick=async()=>{
  try{
    const c=getAuth();$("ghStatus").textContent="Čuvanje...";
    const getUrl=`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${c.path}?ref=${encodeURIComponent(c.branch)}`;
    const gr=await fetch(getUrl,{headers:ghHeaders(c.token)}); if(!gr.ok)throw new Error(`GitHub ${gr.status}`);
    const gd=await gr.json(), lastSha=localStorage.getItem(SHAKEY);
    if(lastSha&&gd.sha!==lastSha&&!confirm("Datoteka na GitHub-u se promenila. Ipak prepisati?"))return;
    const body={message:"Update Frazeoteka 2 database",content:b64encode(JSON.stringify({entries},null,2)),sha:gd.sha,branch:c.branch};
    const pr=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${c.path}`,{method:"PUT",headers:ghHeaders(c.token),body:JSON.stringify(body)});
    if(!pr.ok)throw new Error(`GitHub ${pr.status}: ${await pr.text()}`);
    const pd=await pr.json();localStorage.setItem(SHAKEY,pd.content.sha);$("ghStatus").className="status ok";$("ghStatus").textContent="Sačuvano na GitHub.";
  }catch(e){$("ghStatus").className="status err";$("ghStatus").textContent=e.message}
};
$("searchInput").oninput=renderList;$("typeFilter").onchange=renderList;$("registerFilter").onchange=renderList;
$("resetBtn").onclick=$("clearFilters").onclick=()=>{$("searchInput").value="";$("typeFilter").value="";$("registerFilter").value="";alpha="SVE";buildAlphabet();renderList()};
init();
</script>
